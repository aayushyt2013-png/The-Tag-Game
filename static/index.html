<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TAG</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="frame">

    <!-- top bar, visible during a round -->
    <header id="hud" hidden>
      <div id="chips"></div>
      <div id="timer"><span id="timer-num">2:00</span><div id="timer-bar"><i></i></div></div>
      <div id="round-label">Round 1</div>
    </header>

    <!-- the arena: platforms and players are plain divs styled by CSS -->
    <main id="arena" aria-label="game arena"></main>

    <!-- 3-2-1 / GO -->
    <div id="banner" hidden></div>

    <!-- start popup: translucent red card over a live arena -->
    <section id="menu">
      <div class="popup">
        <h1>TAG<span>!</span></h1>
        <div id="controls"></div>
        <button id="start" class="big">Start <kbd>Space</kbd></button>
        <p id="error" hidden></p>
      </div>
    </section>

    <!-- end of round -->
    <section id="over" class="panel" hidden>
      <h2 id="over-title"></h2>
      <p id="over-sub"></p>
      <div id="standings"></div>
      <div class="row center">
        <button id="again" class="big">Next round <kbd>Enter</kbd></button>
        <button id="to-menu" class="ghost">Menu <kbd>Esc</kbd></button>
      </div>
    </section>

    <button id="mute" type="button" aria-label="Mute sound" aria-pressed="false" title="Mute (M)">🔊</button>

  </div>
  <script src="game.js"></script>
</body>
</html>
